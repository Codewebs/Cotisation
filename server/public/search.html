<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotisation - Rechercher une Tontine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div>
                <h1 class="text-4xl font-black text-cyan-400 tracking-tight">EXPLORER</h1>
                <p class="text-gray-400">Trouvez une tontine et rejoignez la communauté</p>
            </div>

            <div class="flex items-center gap-4 bg-gray-800 p-2 rounded-2xl border border-gray-700 w-full md:w-auto">
                <input id="search-input" type="text" placeholder="Nom de la tontine..."
                    class="bg-transparent border-none focus:ring-0 px-4 py-2 w-full md:w-64"
                    onkeyup="if(event.key === 'Enter') searchTontines()">
                <button onclick="searchTontines()"
                    class="bg-cyan-500 hover:bg-cyan-600 text-gray-900 px-6 py-2 rounded-xl font-bold transition">
                    RECHERCHER
                </button>
            </div>
        </header>

        <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Les résultats s'afficheront ici -->
            <div id="empty-state" class="col-span-full py-20 text-center text-gray-500">
                <svg class="w-16 h-16 mx-auto mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                Commencez par rechercher une tontine ci-dessus
            </div>
        </div>
    </div>

    <script>
        async function searchTontines() {
            const query = document.getElementById('search-input').value;
            const resultsDiv = document.getElementById('results');

            if (!query) return;

            resultsDiv.innerHTML = '<div class="col-span-full text-center py-10 text-cyan-400">Recherche en cours...</div>';

            try {
                const res = await fetch(`/tontines/search?query=${encodeURIComponent(query)}`);
                const data = await res.json();

                resultsDiv.innerHTML = '';

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500">Aucune tontine trouvée</div>';
                    return;
                }

                data.forEach(t => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-800 border border-gray-700 p-6 rounded-2xl hover:border-cyan-500/50 transition duration-300 shadow-xl group";
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-cyan-500/10 text-cyan-400 text-xs font-bold px-2 py-1 rounded">ACTIF</span>
                            <span class="text-gray-500 text-xs">${new Date(t.updatedAt).toLocaleDateString()}</span>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2 group-hover:text-cyan-400 transition">${t.libelle}</h3>
                        <div class="text-sm text-gray-400 space-y-1">
                            <p>Début: <span class="text-gray-300">${t.dateDebut}</span></p>
                            <p>Fin: <span class="text-gray-300">${t.dateFin}</span></p>
                        </div>
                        <button class="w-full mt-6 bg-gray-700 hover:bg-gray-600 py-2 rounded-xl text-sm font-bold transition">VOIR DÉTAILS</button>
                    `;
                    resultsDiv.appendChild(card);
                });
            } catch (e) {
                resultsDiv.innerHTML = '<div class="col-span-full text-center py-20 text-red-400 text-sm">Erreur serveur lors de la recherche</div>';
            }
        }
    </script>
</body>
</html>
