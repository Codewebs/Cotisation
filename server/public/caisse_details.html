<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotisation - Détails de la Caisse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/realtime.js"></script>
    <style>
        .neon-border { border: 1px solid rgba(34, 211, 238, 0.2); }
        .glass { background: rgba(31, 41, 55, 0.8); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">

        <!-- HEADER -->
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="p-3 bg-gray-800 rounded-2xl hover:bg-gray-700 transition border border-gray-700">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <div>
                    <h1 id="caisse-name" class="text-3xl font-black tracking-tight text-white uppercase">Chargement...</h1>
                    <div id="caisse-badge" class="inline-block bg-cyan-500/10 text-cyan-400 text-[10px] font-black px-2 py-0.5 rounded border border-cyan-500/20 uppercase tracking-widest mt-1">TYPE</div>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="window.location.href='/journal?caisseId=' + caisseId" class="p-3 bg-gray-800 rounded-2xl border border-gray-700 text-cyan-400 hover:bg-gray-700 transition" title="Journal des transactions">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                </button>
                <button onclick="window.location.href='/record-loan?caisseId=' + caisseId" class="p-3 bg-gray-800 rounded-2xl border border-gray-700 text-cyan-400 hover:bg-gray-700 transition" title="Accorder un prêt">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <button onclick="window.location.href='/record-expenditure?caisseId=' + caisseId" class="p-3 bg-gray-800 rounded-2xl border border-gray-700 text-red-400 hover:bg-gray-700 transition" title="Sortie de caisse">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
                <button onclick="window.location.href='/distribute-pot?caisseId=' + caisseId" class="p-3 bg-gray-800 rounded-2xl border border-gray-700 text-emerald-400 hover:bg-gray-700 transition" title="Distribuer la cagnotte">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <button class="p-3 bg-gray-800 rounded-2xl border border-gray-700 text-cyan-400 hover:bg-gray-700 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- LEFT: STATS & INFO -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-gray-800 rounded-[2rem] p-8 border border-gray-700 shadow-xl glass">
                    <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Solde Actuel</p>
                    <p id="caisse-balance" class="text-4xl font-black text-white">0 F</p>

                    <div class="mt-4 pt-4 border-t border-gray-700">
                        <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Frais de Caisse (Disponibles)</p>
                        <p id="frais-balance" class="text-xl font-black text-cyan-400">0 F</p>
                    </div>

                    <div class="mt-6 pt-6 border-t border-gray-700 grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-tighter">Membres</p>
                            <p id="stat-members" class="text-lg font-black text-cyan-400">0</p>
                        </div>
                        <div>
                            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-tighter">Cycle Actuel</p>
                            <p id="stat-cycle" class="text-lg font-black text-white">#1</p>
                        </div>
                    </div>

                    <!-- CYCLE SELECTOR -->
                    <div class="mt-6">
                        <label class="block text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1">Sélectionner un Cycle</label>
                        <select id="cycle-select" onchange="onCycleChange(this.value)" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3 py-2 text-xs font-bold text-white outline-none focus:ring-2 focus:ring-cyan-500">
                        </select>
                    </div>
                </div>

                <div class="bg-cyan-500 rounded-[2rem] p-8 shadow-xl shadow-cyan-500/20 group cursor-pointer overflow-hidden relative">
                    <div class="relative z-10">
                        <p class="text-gray-900 text-xs font-black uppercase tracking-widest mb-1">Prochain Bénéficiaire</p>
                        <h3 id="next-ben" class="text-2xl font-black text-gray-900 uppercase tracking-tight">À DÉFINIR</h3>
                    </div>
                    <svg class="absolute -right-4 -bottom-4 w-24 h-24 text-black/10 transform rotate-12 group-hover:scale-125 transition duration-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM7 9a1 1 0 100-2 1 1 0 000 2zm7-1a1 1 0 11-2 0 1 1 0 012 0zm-.464 5.535a1 1 0 10-1.415-1.414 3 3 0 01-4.242 0 1 1 0 00-1.415 1.414 5 5 0 007.072 0z" clip-rule="evenodd"></path></svg>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <!-- CYCLE ACTIONS -->
                <div id="cycle-actions" class="mb-6">
                    <!-- Rempli par JS -->
                </div>

                <!-- TABS -->
                <div class="flex border-b border-gray-800 gap-8 mb-4">
                    <button onclick="showCaisseTab('participants')" id="tab-participants" class="pb-4 border-b-2 tab-active font-black text-xs tracking-widest uppercase transition">Participants</button>
                    <button onclick="showCaisseTab('rotation')" id="tab-rotation" class="pb-4 border-b-2 border-transparent text-gray-500 hover:text-gray-300 font-black text-xs tracking-widest uppercase transition flex items-center gap-2">
                        Rotation
                    </button>
                </div>

                <div id="section-participants">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-black text-white uppercase tracking-tighter">Liste des Cotisants (<span id="part-count">0</span>)</h2>
                        <button class="bg-gray-800 hover:bg-gray-700 text-cyan-400 px-4 py-2 rounded-xl text-xs font-black transition border border-gray-700">GÉRER LES PARTICIPANTS</button>
                    </div>

                    <div id="participant-list" class="space-y-3">
                        <!-- Rempli par JS -->
                    </div>
                </div>

                <div id="section-rotation" class="hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-black text-white uppercase tracking-tighter">Ordre de passage</h2>
                        <button onclick="shuffleOrder()" class="bg-gray-800 hover:bg-gray-700 text-orange-400 px-4 py-2 rounded-xl text-xs font-black transition border border-gray-700">TIRAGE AU SORT</button>
                    </div>
                    <div id="rotation-list" class="space-y-3">
                        <!-- Rempli par JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- FAB ACTIONS (Comme sur Android) -->
        <div class="fixed bottom-8 right-8 flex flex-col items-end gap-4">
            <button onclick="window.location.href='/record-transaction?caisseId=' + caisseId" class="bg-cyan-500 hover:bg-cyan-400 text-gray-900 w-16 h-16 rounded-3xl shadow-2xl flex items-center justify-center transform hover:scale-110 active:scale-95 transition-all">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>

    </div>

    <script>
        const caisseId = new URLSearchParams(window.location.search).get('id');
        let currentUser = null;
        let currentCycleId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!caisseId) { window.location.href = '/profile'; return; }
            currentUser = await getCurrentUser().catch(() => null);
            if (!currentUser) { window.location.href = '/login'; return; }
            fetchCaisseDetails();
            fetchRotation();
        });

        function showCaisseTab(tab) {
            const tabs = ['participants', 'rotation'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('tab-active');
                document.getElementById(`tab-${t}`).classList.add('border-transparent', 'text-gray-500');
                document.getElementById(`section-${t}`).classList.add('hidden');
            });
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById(`tab-${tab}`).classList.remove('border-transparent', 'text-gray-500');
            document.getElementById(`section-${tab}`).classList.remove('hidden');
        }

        let allCycles = [];
        let selectedCycleId = null;
        let isTontineAdmin = false;

        async function fetchCaisseDetails() {
            try {
                const { data: caisse, error } = await db.from('caisses')
                    .select('*,cycles(id,numero_cycle,est_cloture),transactions(montant,type)')
                    .eq('id', caisseId).single();
                if (error) throw error;

                document.getElementById('caisse-name').innerText = caisse.libelle;
                document.getElementById('caisse-badge').innerText = (caisse.type || '').replace('_', ' ');

                // Check admin status (tontine initiator or president)
                const [tontineRes, memberRes] = await Promise.all([
                    db.from('tontines').select('admin_id').eq('id', caisse.tontine_id).single(),
                    db.from('members').select('role').eq('tontine_id', caisse.tontine_id).eq('user_id', currentUser.id).maybeSingle()
                ]);
                const tontine = tontineRes.data;
                const member = memberRes.data;
                isTontineAdmin = (tontine && tontine.admin_id === currentUser.id) || (member && member.role === 'PRESIDENT');

                // Calculer le solde et les frais de caisse
                let solde = 0;
                let soldeFrais = 0;
                if (caisse.transactions) {
                    caisse.transactions.forEach(t => {
                        const m = parseInt(t.montant, 10);
                        solde += m;
                        if (t.type === 'FRAIS_CAISSE') {
                            soldeFrais += m;
                        }
                    });
                }
                document.getElementById('caisse-balance').innerText = `${solde.toLocaleString()} F`;
                document.getElementById('frais-balance').innerText = `${soldeFrais.toLocaleString()} F`;

                allCycles = (caisse.cycles || []).sort((a, b) => b.numero_cycle - a.numero_cycle);
                const select = document.getElementById('cycle-select');
                select.innerHTML = '';
                allCycles.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.innerText = `Cycle #${c.numero_cycle} (${c.est_cloture ? 'Clôturé' : 'Actif'})`;
                    select.appendChild(opt);
                });

                const activeCycle = allCycles.find(c => !c.est_cloture) || allCycles[0];
                if (activeCycle) {
                    selectedCycleId = activeCycle.id;
                    select.value = selectedCycleId;
                }

                await loadCycleData(selectedCycleId);

                const list = document.getElementById('participant-list');
                list.innerHTML = '';

                const { data: members, error: membersError } = await db.from('members')
                    .select('id,nom_saisi').eq('tontine_id', caisse.tontine_id).order('joined_at');
                if (membersError) throw membersError;
                document.getElementById('part-count').innerText = members.length;
                document.getElementById('stat-members').innerText = members.length;

                members.forEach((m, index) => {
                    const item = document.createElement('div');
                    item.className = "bg-gray-800/40 border border-gray-700 p-5 rounded-[2rem] flex items-center gap-5 hover:border-cyan-500/30 transition shadow-lg cursor-pointer";
                    item.onclick = () => window.location.href = `/record-transaction?caisseId=${caisseId}&memberId=${m.id}`;
                    item.innerHTML = `
                        <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center font-black text-gray-400">${index + 1}</div>
                        <div class="flex-1">
                            <p class="font-black text-white uppercase text-sm leading-none mb-1">${escapeHtml(m.nom_saisi)}</p>
                            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Ordre : ${index + 1}</p>
                        </div>
                        <div class="flex gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-gray-600 shadow-[0_0_10px_rgba(75,85,99,0.5)]"></span>
                        </div>
                    `;
                    list.appendChild(item);
                });

            } catch (e) { console.error(e); }
        }

        async function loadCycleData(cycleId) {
            currentCycleId = cycleId;
            const cycle = allCycles.find(c => c.id == cycleId);
            if (cycle) {
                document.getElementById('stat-cycle').innerText = `#${cycle.numero_cycle}`;
            }

            const { data: tour } = cycleId ? await db.from('tours')
                .select('beneficiary_id,member:members!tours_beneficiary_id_fkey(nom_saisi)')
                .eq('cycle_id', cycleId).eq('est_termine', false)
                .order('numero_tour').limit(1).maybeSingle() : { data: null };
            if (tour && tour.member) {
                document.getElementById('next-ben').innerText = tour.member.nom_saisi;
            } else {
                document.getElementById('next-ben').innerText = "À DÉFINIR";
            }

            const cycleActions = document.getElementById('cycle-actions');
            cycleActions.innerHTML = '';

            if (cycle && !cycle.est_cloture) {
                const hasHigher = allCycles.some(c => c.numero_cycle > cycle.numero_cycle);
                const buttonText = hasHigher ? "Refermer le Cycle" : "Clôturer le Cycle";
                cycleActions.innerHTML = `
                    <button onclick="confirmCloseCycle()" class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white border border-red-500/30 rounded-2xl py-4 text-xs font-black uppercase tracking-widest transition duration-300 shadow-xl">
                        ${buttonText}
                    </button>
                `;
            } else if (cycle && cycle.est_cloture) {
                if (isTontineAdmin) {
                    cycleActions.innerHTML = `
                        <button onclick="confirmReopenCycle('${cycle.id}')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-900 border border-cyan-500/20 rounded-2xl py-4 text-xs font-black uppercase tracking-widest transition duration-300 shadow-xl">
                            Réouvrir ce Cycle Clôturé
                        </button>
                    `;
                } else {
                    cycleActions.innerHTML = `
                        <div class="bg-gray-800/40 border border-gray-700 p-4 rounded-2xl text-center">
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Cycle Clôturé</p>
                        </div>
                    `;
                }
            }
        }

        function onCycleChange(cycleId) {
            selectedCycleId = cycleId;
            loadCycleData(selectedCycleId);
        }

        async function confirmCloseCycle() {
            if (!confirm("Êtes-vous sûr de vouloir clôturer ce cycle ?")) return;

            try {
                const currentCycle = allCycles.find(c => c.id == selectedCycleId);
                if (!currentCycle) throw new Error("Cycle introuvable.");

                const { error: closeError } = await db.from('cycles').update({
                    est_cloture: true, date_fin: Date.now()
                }).eq('id', currentCycle.id);
                if (closeError) throw closeError;

                const nextNum = currentCycle.numero_cycle + 1;
                const existingNext = allCycles.find(c => c.numero_cycle === nextNum);

                if (!existingNext) {
                    const { error: newCycleError } = await db.from('cycles').insert({
                        caisse_id: caisseId, numero_cycle: nextNum, date_debut: Date.now()
                    });
                    if (newCycleError) throw newCycleError;
                    alert("Cycle clôturé. Un nouveau cycle a été créé.");
                } else {
                    alert("Cycle clôturé.");
                }
                fetchCaisseDetails();
            } catch (e) {
                alert(e.message || "Erreur lors de la clôture");
            }
        }

        async function confirmReopenCycle(cycleId) {
            if (!confirm("Voulez-vous vraiment réouvrir ce cycle ? Cela va refermer temporairement le cycle actuellement ouvert.")) return;
            try {
                const openCycle = allCycles.find(c => !c.est_cloture && c.id != cycleId);
                if (openCycle) {
                    await db.from('cycles').update({
                        est_cloture: true, date_fin: Date.now()
                    }).eq('id', openCycle.id);
                }
                const { error } = await db.from('cycles').update({
                    est_cloture: false,
                    date_fin: null
                }).eq('id', cycleId);
                if (error) throw error;
                alert("Cycle réouvert avec succès.");
                fetchCaisseDetails();
            } catch (e) {
                alert(e.message || "Erreur lors de la réouverture du cycle");
            }
        }

        async function fetchRotation() {
            try {
                const { data: participants, error } = await db.from('caisse_participants')
                    .select('member_id,ordre_passage,members(id,nom_saisi)')
                    .eq('caisse_id', caisseId).order('ordre_passage');
                if (error) throw error;
                const list = document.getElementById('rotation-list');
                list.innerHTML = '';

                participants.forEach((p, index) => {
                    const item = document.createElement('div');
                    item.className = "bg-gray-800/40 border border-gray-700 p-5 rounded-[2rem] flex items-center gap-5";
                    item.innerHTML = `
                        <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center font-black text-xs text-gray-400">${index + 1}</div>
                        <div class="flex-1">
                            <p class="font-black text-white uppercase text-sm">${escapeHtml(p.members.nom_saisi)}</p>
                        </div>
                        <button onclick="setAsBeneficiary('${p.member_id}', ${index + 1})" class="bg-cyan-500/10 hover:bg-cyan-500 text-cyan-400 hover:text-gray-900 px-4 py-2 rounded-xl text-[10px] font-black transition border border-cyan-500/20 uppercase tracking-tighter">Bénéficiaire</button>
                    `;
                    list.appendChild(item);
                });
            } catch (e) { console.error(e); }
        }

        async function setAsBeneficiary(memberId, numTour) {
            try {
                if (!currentCycleId) throw new Error("Aucun cycle actif.");
                const { data: existing, error } = await db.from('tours').select('id')
                    .eq('cycle_id', currentCycleId).eq('numero_tour', numTour).maybeSingle();
                if (error) throw error;
                const result = existing
                    ? await db.from('tours').update({ beneficiary_id: memberId }).eq('id', existing.id)
                    : await db.from('tours').insert({
                        cycle_id: currentCycleId, beneficiary_id: memberId, numero_tour: numTour
                    });
                if (result.error) throw result.error;
                alert("Bénéficiaire défini pour ce tour !");
                fetchCaisseDetails();
            } catch (e) { alert(e.message || "Erreur"); }
        }
    </script>
</body>
</html>
