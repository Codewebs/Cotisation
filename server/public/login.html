<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotisation - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-8">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-cyan-400">Connexion</h2>
            <p class="text-gray-400 mt-2">Accédez à votre espace membre</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Téléphone</label>
                <input id="phone" type="tel" placeholder="Votre numéro"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Code PIN</label>
                <input id="pin" type="password" placeholder="••••" maxlength="4"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition text-center tracking-widest text-2xl">
            </div>

            <button onclick="login()"
                class="w-full bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-bold py-3 rounded-lg shadow-lg transform active:scale-95 transition duration-150">
                SE CONNECTER
            </button>
        </div>

        <div id="msg-box" class="hidden mt-6 p-4 rounded-lg text-sm text-center"></div>

        <div class="mt-8 text-center text-sm text-gray-400">
            Pas encore de compte ? <a href="/register" class="text-cyan-400 hover:underline">Inscrivez-vous</a>
        </div>
    </div>

    <script>
        async function login() {
            const msgBox = document.getElementById('msg-box');
            const data = {
                phone: document.getElementById('phone').value,
                pin: document.getElementById('pin').value
            };

            try {
                const res = await fetch('/users/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                msgBox.classList.remove('hidden', 'bg-red-900/50', 'text-red-400', 'bg-green-900/50', 'text-green-400');
                if (res.ok) {
                    localStorage.setItem('currentUser', JSON.stringify(result));
                    msgBox.classList.add('bg-green-900/50', 'text-green-400');
                    msgBox.innerText = "Bienvenue, " + result.nom;
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    msgBox.classList.add('bg-red-900/50', 'text-red-400');
                    msgBox.innerText = result.error || "Identifiants invalides";
                }
            } catch (e) {
                msgBox.classList.remove('hidden');
                msgBox.classList.add('bg-red-900/50', 'text-red-400');
                msgBox.innerText = "Erreur de connexion";
            }
        }
    </script>
</body>
</html>
