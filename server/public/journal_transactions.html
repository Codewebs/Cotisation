<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotisation - Journal des Transactions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/realtime.js"></script>
    <style>
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto">

        <!-- HEADER -->
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="p-3 bg-gray-800 rounded-2xl hover:bg-gray-700 transition border border-gray-700">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <div>
                    <h1 id="caisse-name" class="text-3xl font-black tracking-tight text-white uppercase">JOURNAL DES OPÉRATIONS</h1>
                    <p id="cycle-info" class="text-cyan-500 font-mono text-xs font-bold mt-1 uppercase tracking-widest">CHARGEMENT...</p>
                </div>
            </div>

            <div class="bg-gray-800 px-6 py-3 rounded-2xl border border-gray-700">
                <p class="text-[10px] text-gray-500 font-black uppercase tracking-widest mb-1 text-center">Volume Total</p>
                <p id="total-volume" class="text-xl font-black text-white">0 F</p>
            </div>
        </header>

        <!-- TRANSACTION LIST -->
        <div class="bg-gray-800/50 rounded-[2.5rem] border border-gray-700 glass overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/50 border-b border-gray-700">
                            <th class="px-8 py-5 text-[10px] font-black text-gray-500 uppercase tracking-widest">Date & Heure</th>
                            <th class="px-8 py-5 text-[10px] font-black text-gray-500 uppercase tracking-widest">Membre</th>
                            <th class="px-8 py-5 text-[10px] font-black text-gray-500 uppercase tracking-widest">Type / Motif</th>
                            <th class="px-8 py-5 text-[10px] font-black text-gray-500 uppercase tracking-widest text-right">Montant</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                        <!-- Rempli par JS -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden py-24 text-center text-gray-600 uppercase text-xs font-black tracking-widest">
                Aucune transaction dans ce cycle
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const caisseId = urlParams.get('caisseId');

        document.addEventListener('DOMContentLoaded', () => {
            if (!caisseId) { window.location.href = '/profile'; return; }
            fetchJournal();
        });

        async function fetchJournal() {
            try {
                const { data: caisse, error } = await db.from('caisses')
                    .select('*,cycles(id,numero_cycle,est_cloture),transactions(id,member_id,montant,type,motif,date_transaction,cycle_id)')
                    .eq('id', caisseId).single();
                if (error) throw error;

                document.getElementById('caisse-name').innerText = `JOURNAL - ${caisse.libelle}`;
                const cycle = (caisse.cycles || []).filter(item => !item.est_cloture)
                    .sort((a, b) => b.numero_cycle - a.numero_cycle)[0];
                if (cycle) document.getElementById('cycle-info').innerText = `Cycle #${cycle.numero_cycle} • Opérations Actives`;

                const list = document.getElementById('transaction-list');
                const empty = document.getElementById('empty-state');
                list.innerHTML = '';

                const transactions = (caisse.transactions || []).filter(tx => !cycle || tx.cycle_id === cycle.id);
                if (transactions.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }

                let total = 0;
                // On trie par date décroissante
                transactions.sort((a, b) => b.date_transaction - a.date_transaction);

                const { data: members, error: membersError } = await db.from('members')
                    .select('id,nom_saisi').eq('tontine_id', caisse.tontine_id);
                if (membersError) throw membersError;
                const membersMap = {};
                members.forEach(m => membersMap[m.id] = m.nom_saisi);

                transactions.forEach(t => {
                    total += Math.abs(t.montant);
                    const date = new Date(parseInt(t.date_transaction, 10));
                    const row = document.createElement('tr');
                    row.className = "border-b border-gray-700/50 hover:bg-white/5 transition group";

                    const isExpense = t.montant < 0 || t.type === 'SORTIE';
                    const amountClass = isExpense ? "text-red-400" : "text-emerald-400";
                    const amountPrefix = isExpense ? "-" : "+";

                    row.innerHTML = `
                        <td class="px-8 py-6">
                            <p class="text-sm font-bold text-white">${date.toLocaleDateString()}</p>
                            <p class="text-[10px] text-gray-500 font-mono">${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                        </td>
                        <td class="px-8 py-6">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-[10px] font-black text-cyan-400 border border-cyan-500/20">
                                    ${escapeHtml((membersMap[t.member_id] || '?').charAt(0))}
                                </div>
                                <p class="text-sm font-black uppercase text-gray-300 group-hover:text-white transition">${escapeHtml(membersMap[t.member_id] || 'Inconnu')}</p>
                            </div>
                        </td>
                        <td class="px-8 py-6">
                            <span class="bg-gray-700/50 text-gray-400 text-[9px] font-black px-2 py-1 rounded border border-gray-600 uppercase tracking-widest mb-1 inline-block">${escapeHtml(t.type)}</span>
                            <p class="text-xs text-gray-500 font-medium">${escapeHtml(t.motif || 'Aucun motif')}</p>
                        </td>
                        <td class="px-8 py-6 text-right">
                            <p class="text-lg font-black ${amountClass}">${amountPrefix}${Math.abs(t.montant).toLocaleString()} F</p>
                        </td>
                    `;
                    list.appendChild(row);
                });

                document.getElementById('total-volume').innerText = `${total.toLocaleString()} F`;

            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
