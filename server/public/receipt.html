<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotisation - Reçu de Paiement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/realtime.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex items-center justify-center font-sans">

    <div id="receipt-box" class="max-w-md w-full bg-white text-gray-900 rounded-[2.5rem] p-8 shadow-2xl relative overflow-hidden">

        <!-- Header -->
        <div class="text-center mb-8 border-b border-gray-100 pb-8">
            <div class="w-16 h-16 bg-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white text-2xl font-black">C</div>
            <h1 class="text-xl font-black uppercase tracking-tighter">Reçu de Paiement</h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">Transaction Numérique</p>
        </div>

        <!-- Details -->
        <div class="space-y-6">
            <div class="flex justify-between items-end">
                <div>
                    <p class="text-[10px] font-black text-gray-400 uppercase">Membre</p>
                    <p id="member-name" class="font-black text-lg uppercase tracking-tight">CHARGEMENT...</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-black text-gray-400 uppercase">Date</p>
                    <p id="tx-date" class="text-xs font-bold">--/--/----</p>
                </div>
            </div>

            <div class="bg-gray-50 rounded-3xl p-6 border border-gray-100 text-center">
                <p class="text-[10px] font-black text-gray-400 uppercase mb-2">Montant perçu</p>
                <p id="tx-amount" class="text-4xl font-black text-cyan-600">0 F</p>
                <p id="tx-type" class="text-[9px] font-black text-cyan-500 uppercase mt-2 tracking-widest">---</p>
            </div>

            <div class="space-y-3">
                <div class="flex justify-between text-xs font-bold">
                    <span class="text-gray-400 uppercase">Caisse</span>
                    <span id="caisse-name" class="text-gray-700">----</span>
                </div>
                <div class="flex justify-between text-xs font-bold">
                    <span class="text-gray-400 uppercase">Motif</span>
                    <span id="tx-motif" class="text-gray-700 italic text-right max-w-[150px]">----</span>
                </div>
            </div>

            <!-- Signature Section -->
            <div class="mt-8 p-4 bg-cyan-50/50 rounded-2xl border border-cyan-100/50 relative">
                <p class="text-[8px] font-black text-cyan-400 uppercase mb-2 tracking-widest text-center">Certification Numérique</p>
                <div class="flex flex-col items-center gap-1">
                    <p id="validator-name" class="text-sm font-black text-gray-800 uppercase italic">ADMINISTRATEUR</p>
                    <p class="text-[7px] text-gray-400 font-mono">Signé électroniquement via Cotisation API</p>
                </div>
                <!-- Mini Logo/Watermark -->
                <div class="absolute right-2 bottom-2 opacity-10">
                    <svg class="w-8 h-8 text-cyan-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-10 pt-8 border-t border-dashed border-gray-200 text-center">
            <p class="text-[9px] font-black text-gray-300 uppercase tracking-[0.2em]">Merci pour votre confiance</p>
            <div class="mt-6 flex gap-2">
                <button onclick="downloadReceipt()" class="flex-1 bg-gray-900 text-white py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-800 transition">Télécharger PDF</button>
                <button onclick="history.back()" class="px-6 py-3 rounded-2xl text-[10px] font-black uppercase text-gray-400 border border-gray-100">Fermer</button>
            </div>
        </div>

        <!-- Decorative Circles -->
        <div class="absolute -top-10 -right-10 w-24 h-24 bg-cyan-500/5 rounded-full"></div>
    </div>

    <script>
        const txId = new URLSearchParams(window.location.search).get('txId');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!txId) return;

            try {
                const { data: tx, error } = await db.from('transactions')
                    .select('*,caisses(libelle)').eq('id', txId).single();
                if (error) throw error;
                const user = await getCurrentUser();
                const { data: member } = await db.from('members').select('nom_saisi').eq('id', tx.member_id).maybeSingle();
                document.getElementById('member-name').innerText = member ? member.nom_saisi : (user?.nom || '');
                document.getElementById('tx-date').innerText = new Date(parseInt(tx.date_transaction, 10)).toLocaleDateString();
                document.getElementById('tx-amount').innerText = `${parseInt(tx.montant, 10).toLocaleString()} F`;
                document.getElementById('tx-type').innerText = tx.type;
                document.getElementById('caisse-name').innerText = tx.caisses.libelle;
                document.getElementById('tx-motif').innerText = tx.motif || 'Aucun motif spécifié';
                document.getElementById('validator-name').innerText = tx.validated_by_id === user?.id ? (user.nom || user.email) : 'ADMINISTRATEUR';

            } catch (e) { console.error(e); }
        });

        async function downloadReceipt() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', [100, 150]); // Format reçu compact

            doc.setFontSize(10);
            doc.text("REÇU DE PAIEMENT - COTISATION", 10, 20);
            doc.line(10, 22, 90, 22);

            doc.setFontSize(8);
            doc.text(`Membre: ${document.getElementById('member-name').innerText}`, 10, 35);
            doc.text(`Date: ${document.getElementById('tx-date').innerText}`, 10, 42);
            doc.text(`Caisse: ${document.getElementById('caisse-name').innerText}`, 10, 49);

            doc.setFontSize(14);
            doc.text(`Montant: ${document.getElementById('tx-amount').innerText}`, 10, 70);

            doc.setFontSize(8);
            doc.text(`Validé par: ${document.getElementById('validator-name').innerText}`, 10, 85);
            doc.text("Signature Numérique Certifiée", 10, 90);

            doc.setFontSize(7);
            doc.text("Document numérique certifié par Cotisation App", 10, 140);

            doc.save(`Recu_${txId.substring(0,8)}.pdf`);
        }
    </script>
</body>
</html>
