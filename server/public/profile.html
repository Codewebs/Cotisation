<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotisation - Mon Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/realtime.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header Profil -->
        <div class="bg-gray-800 rounded-3xl p-8 border border-gray-700 shadow-2xl mb-8">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="w-24 h-24 bg-cyan-500 rounded-full flex items-center justify-center text-3xl font-black text-gray-900 shadow-lg shadow-cyan-500/20">
                    <span id="user-initial">U</span>
                </div>
                <div class="text-center md:text-left flex-1">
                    <h1 id="user-name" class="text-3xl font-black tracking-tight mb-1">Chargement...</h1>
                    <div class="flex flex-wrap justify-center md:justify-start gap-3">
                        <span id="user-matricule" class="bg-gray-700 text-gray-300 text-xs font-mono px-3 py-1 rounded-full border border-gray-600">----</span>
                        <span id="user-phone" class="bg-gray-700 text-gray-300 text-xs font-mono px-3 py-1 rounded-full border border-gray-600">----</span>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-sm font-bold transition">DÉCONNEXION</button>
            </div>
        </div>

        <!-- Section Statistiques Administrateur (Si applicable) -->
        <div id="admin-stats-section" class="hidden mb-12 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-cyan-500/10 border border-cyan-500/20 rounded-3xl p-6 glass">
                <p class="text-[10px] font-black text-cyan-500 uppercase tracking-widest mb-1">Signatures ce mois</p>
                <p id="sig-count" class="text-3xl font-black text-white">0</p>
                <p id="sig-month" class="text-[8px] text-gray-500 uppercase font-bold mt-2">JANVIER</p>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-3xl p-6 glass">
                <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest mb-1">Volume Certifié</p>
                <p id="sig-volume" class="text-3xl font-black text-white">0 F</p>
                <p class="text-[8px] text-gray-500 uppercase font-bold mt-2">ENCAISSEMENTS VALIDÉS</p>
            </div>
            <div class="bg-purple-500/10 border border-purple-500/20 rounded-3xl p-6 glass flex items-center justify-center">
                <div class="text-center">
                    <p class="text-[10px] font-black text-purple-500 uppercase tracking-widest mb-2">Statut Certification</p>
                    <span class="bg-purple-500 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase">Actif</span>
                </div>
            </div>
        </div>

        <!-- Section Tontines -->
        <div class="mb-6 flex justify-between items-center">
            <h2 class="text-xl font-bold text-cyan-400 tracking-wide uppercase">Mes Tontines</h2>
            <a href="/create-tontine" class="bg-cyan-500 hover:bg-cyan-600 text-gray-900 px-4 py-2 rounded-xl text-sm font-bold transition">LANCER UNE TONTINE</a>
        </div>

        <div id="tontine-list" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
            <!-- Rempli par JS -->
        </div>

        <!-- Section Notifications -->
        <div class="mb-6">
            <h2 class="text-xl font-bold text-cyan-400 tracking-wide uppercase">Notifications & Reçus</h2>
        </div>
        <div id="notification-list" class="space-y-3">
            <!-- Rempli par JS -->
        </div>

        <div id="empty-state" class="hidden py-20 text-center bg-gray-800/50 rounded-3xl border border-dashed border-gray-700">
            <p class="text-gray-500">Vous ne participez à aucune tontine pour le moment.</p>
            <a href="/search" class="text-cyan-400 hover:underline mt-2 inline-block">Rechercher une tontine</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await getCurrentUser().catch(() => null);
            if (!user) {
                window.location.href = '/login';
                return;
            }

            // UI User Info
            document.getElementById('user-name').innerText = user.nom || user.email || '';
            document.getElementById('user-initial').innerText = (user.nom || user.email || '?').charAt(0).toUpperCase();
            document.getElementById('user-matricule').innerText = user.matricule || '—';
            document.getElementById('user-phone').innerText = user.phone || '—';

            window.addEventListener('new_notification', () => fetchNotifications(user.id));
            fetchTontines(user.id);
            fetchNotifications(user.id);
            fetchSignatureStats(user.id);
        });

        async function fetchSignatureStats(userId) {
            try {
                const start = new Date();
                start.setDate(1);
                start.setHours(0, 0, 0, 0);
                const { data: transactions, error } = await db.from('transactions')
                    .select('montant').eq('validated_by_id', userId)
                    .gte('date_transaction', start.getTime());
                if (error) throw error;
                const count = transactions.length;
                const totalAmount = transactions.reduce((sum, tx) => sum + Number(tx.montant || 0), 0);
                if (count > 0) {
                    document.getElementById('admin-stats-section').classList.remove('hidden');
                    document.getElementById('sig-count').innerText = count;
                    document.getElementById('sig-volume').innerText = `${totalAmount.toLocaleString()} F`;
                    document.getElementById('sig-month').innerText = start.toLocaleString('fr-FR', { month: 'long' }).toUpperCase();
                }
            } catch (e) { console.error(e); }
        }

        async function fetchNotifications(userId) {
            const list = document.getElementById('notification-list');
            try {
                const { data: notifications, error } = await db.from('notifications')
                    .select('*').eq('user_id', userId).order('created_at', { ascending: false });
                if (error) throw error;
                list.innerHTML = '';

                if (notifications.length === 0) {
                    list.innerHTML = '<p class="text-gray-600 text-sm italic">Aucune notification.</p>';
                    return;
                }

                notifications.forEach(n => {
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-2xl border transition cursor-pointer flex justify-between items-center ${n.is_read ? 'bg-gray-800/20 border-gray-800' : 'bg-cyan-500/5 border-cyan-500/30'}`;
                    card.onclick = () => {
                        if (n.type === 'RECEIPT') window.location.href = `/receipt?txId=${n.reference_id}`;
                        else if (n.type === 'CYCLE_OPEN' || n.type === 'CYCLE_CLOSE') window.location.href = `/caisse-details?id=${n.reference_id}`;
                        else if (n.reference_id) window.location.href = `/tontine-details?id=${n.reference_id}`;
                        markAsRead(n.id);
                    };
                    card.innerHTML = `
                        <div>
                            <p class="text-sm font-bold text-white">${escapeHtml(n.title)}</p>
                            <p class="text-xs text-gray-500">${escapeHtml(n.message)}</p>
                        </div>
                        ${!n.is_read ? '<span class="w-2 h-2 bg-cyan-500 rounded-full"></span>' : ''}
                    `;
                    list.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        async function markAsRead(id) {
            const { error } = await db.from('notifications').update({ is_read: true }).eq('id', id);
            if (error) console.error(error);
        }

        async function fetchTontines(userId) {
            const list = document.getElementById('tontine-list');
            const empty = document.getElementById('empty-state');

            try {
                const { data: memberships, error: memberError } = await db.from('members')
                    .select('tontine_id').eq('user_id', userId);
                if (memberError) throw memberError;
                const ids = memberships.map(m => m.tontine_id);
                if (!ids.length) {
                    empty.classList.remove('hidden');
                    return;
                }
                const { data: tontines, error } = await db.from('tontines')
                    .select('*').in('id', ids);
                if (error) throw error;

                if (tontines.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }

                tontines.forEach(t => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-800 border border-gray-700 p-6 rounded-2xl hover:border-cyan-500/50 transition duration-300 shadow-xl group cursor-pointer";
                    card.onclick = () => window.location.href = `/tontine-details?id=${t.id}`;
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded border border-emerald-500/20">MEMBRE</span>
                            <span class="text-gray-500 text-xs">${escapeHtml(t.exercice || '---')}</span>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2 group-hover:text-cyan-400 transition">${escapeHtml(t.libelle)}</h3>
                        <div class="text-xs text-gray-500 flex items-center gap-4">
                            <span>📅 ${escapeHtml(t.date_debut)}</span>
                            <span>🏁 ${escapeHtml(t.date_fin)}</span>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (e) {
                console.error("Erreur fetch:", e);
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            db.auth.signOut().finally(() => window.location.href = '/login');
        }
    </script>
</body>
</html>
