<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotisation - Créer une Caisse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/realtime.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="max-w-3xl w-full bg-gray-800 rounded-[2.5rem] shadow-2xl border border-gray-700 p-8 md:p-12">
        <div class="mb-10">
            <h1 class="text-3xl font-black text-cyan-400 uppercase tracking-tighter">Nouvelle Caisse</h1>
            <p class="text-gray-500 text-sm font-bold">Configurez les règles de cette caisse spécifique</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Infos de base -->
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Type de Caisse</label>
                    <select id="type" class="w-full bg-gray-700 border border-gray-600 rounded-2xl px-5 py-4 text-sm font-bold focus:ring-2 focus:ring-cyan-500 outline-none transition">
                        <option value="COTISATION_SIMPLE">Cotisation Simple</option>
                        <option value="PRET">Caisse de Prêt</option>
                        <option value="SECOURS">Caisse de Secours</option>
                        <option value="DEVELOPPEMENT">Développement</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Libellé</label>
                    <input id="libelle" type="text" placeholder="Ex: Caisse Scolaire" class="w-full bg-gray-700 border border-gray-600 rounded-2xl px-5 py-4 text-sm font-bold focus:ring-2 focus:ring-cyan-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Montant Fixe (Optionnel)</label>
                    <input id="montantFixe" type="number" placeholder="Ex: 5000" class="w-full bg-gray-700 border border-gray-600 rounded-2xl px-5 py-4 text-sm font-bold focus:ring-2 focus:ring-cyan-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Frais de gestion / prélèvement (FCFA)</label>
                    <input id="fraisCaisse" type="number" placeholder="Ex: 200" class="w-full bg-gray-700 border border-gray-600 rounded-2xl px-5 py-4 text-sm font-bold focus:ring-2 focus:ring-cyan-500 outline-none transition">
                </div>
            </div>

            <!-- Paramètres avancés -->
            <div class="space-y-6">
                <div class="p-6 bg-gray-900/50 rounded-3xl border border-gray-700">
                    <h3 class="text-xs font-black text-cyan-400 uppercase mb-4 tracking-widest">Options</h3>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-gray-300">Redistribution</span>
                            <input type="checkbox" id="redistribution" class="w-6 h-6 rounded-lg bg-gray-700 border-gray-600 text-cyan-500 focus:ring-cyan-500">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-gray-300">Possibilité de Prêt</span>
                            <input type="checkbox" id="possibilitePret" onchange="toggleFineLoan()" class="w-6 h-6 rounded-lg bg-gray-700 border-gray-600 text-cyan-500 focus:ring-cyan-500">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-gray-300">Prêts sur les amendes</span>
                            <input type="checkbox" id="autoriserPretSurAmendes" class="w-6 h-6 rounded-lg bg-gray-700 border-gray-600 text-cyan-500 focus:ring-cyan-500">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Pénalité de Retard</label>
                    <input id="penaliteRetard" type="number" placeholder="Ex: 500" class="w-full bg-gray-700 border border-gray-600 rounded-2xl px-5 py-4 text-sm font-bold focus:ring-2 focus:ring-cyan-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Jour / Date Limite de Paiement</label>
                    <select id="dateLimiteJour" class="w-full bg-gray-700 border border-gray-600 rounded-2xl px-5 py-4 text-sm font-bold text-white focus:ring-2 focus:ring-cyan-500 outline-none appearance-none transition">
                        <option value="">-- CHOISIR LE JOUR/DATE --</option>
                        <optgroup label="Jours de la semaine (Hebdo)">
                            <option value="1">Lundi</option>
                            <option value="2">Mardi</option>
                            <option value="3">Mercredi</option>
                            <option value="4">Jeudi</option>
                            <option value="5">Vendredi</option>
                            <option value="6">Samedi</option>
                            <option value="7">Dimanche</option>
                        </optgroup>
                        <optgroup label="Dates du mois (Mensuel)">
                            <option value="1">1er du mois</option>
                            <option value="2">2 du mois</option>
                            <option value="3">3 du mois</option>
                            <option value="4">4 du mois</option>
                            <option value="5">5 du mois</option>
                            <option value="6">6 du mois</option>
                            <option value="7">7 du mois</option>
                            <option value="8">8 du mois</option>
                            <option value="9">9 du mois</option>
                            <option value="10">10 du mois</option>
                            <option value="11">11 du mois</option>
                            <option value="12">12 du mois</option>
                            <option value="13">13 du mois</option>
                            <option value="14">14 du mois</option>
                            <option value="15">15 du mois</option>
                            <option value="16">16 du mois</option>
                            <option value="17">17 du mois</option>
                            <option value="18">18 du mois</option>
                            <option value="19">19 du mois</option>
                            <option value="20">20 du mois</option>
                            <option value="21">21 du mois</option>
                            <option value="22">22 du mois</option>
                            <option value="23">23 du mois</option>
                            <option value="24">24 du mois</option>
                            <option value="25">25 du mois</option>
                            <option value="26">26 du mois</option>
                            <option value="27">27 du mois</option>
                            <option value="28">28 du mois</option>
                            <option value="29">29 du mois</option>
                            <option value="30">30 du mois</option>
                            <option value="31">31 du mois</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Heure Limite de Paiement</label>
                    <select id="heureLimite" class="w-full bg-gray-700 border border-gray-600 rounded-2xl px-5 py-4 text-sm font-bold text-white focus:ring-2 focus:ring-cyan-500 outline-none appearance-none transition">
                        <option value="">-- CHOISIR L'HEURE --</option>
                        <option value="0">00h00</option>
                        <option value="1">01h00</option>
                        <option value="2">02h00</option>
                        <option value="3">03h00</option>
                        <option value="4">04h00</option>
                        <option value="5">05h00</option>
                        <option value="6">06h00</option>
                        <option value="7">07h00</option>
                        <option value="8">08h00</option>
                        <option value="9">09h00</option>
                        <option value="10">10h00</option>
                        <option value="11">11h00</option>
                        <option value="12">12h00</option>
                        <option value="13">13h00</option>
                        <option value="14">14h00</option>
                        <option value="15">15h00</option>
                        <option value="16">16h00</option>
                        <option value="17">17h00</option>
                        <option value="18">18h00</option>
                        <option value="19">19h00</option>
                        <option value="20">20h00</option>
                        <option value="21">21h00</option>
                        <option value="22">22h00</option>
                        <option value="23">23h00</option>
                    </select>
                </div>
            </div>
        </div>

        <button onclick="saveCaisse()" class="w-full mt-12 bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-black py-5 rounded-3xl shadow-xl shadow-cyan-500/20 transform active:scale-95 transition uppercase tracking-tighter">
            Enregistrer la Caisse
        </button>

        <div class="mt-8 text-center">
            <button onclick="history.back()" class="text-xs font-bold text-gray-600 hover:text-white transition uppercase">Annuler et retourner</button>
        </div>
    </div>

    <script>
        const tontineId = new URLSearchParams(window.location.search).get('tontineId');

        function toggleFineLoan() {
            const loan = document.getElementById('possibilitePret');
            const fineLoan = document.getElementById('autoriserPretSurAmendes');
            if (loan.checked) {
                fineLoan.checked = false;
                fineLoan.disabled = true;
            } else {
                fineLoan.disabled = false;
            }
        }

        async function saveCaisse() {
            if (!tontineId || tontineId === '${tontineId}') {
                return alert("Erreur : ID de Tontine invalide. Veuillez retourner à la page précédente et rafraîchir.");
            }

            const data = {
                tontine_id: tontineId,
                type: document.getElementById('type').value,
                libelle: document.getElementById('libelle').value,
                montant_fixe: document.getElementById('montantFixe').value || null,
                redistribution: document.getElementById('redistribution').checked,
                possibilite_pret: document.getElementById('possibilitePret').checked,
                autoriser_pret_sur_amendes: document.getElementById('autoriserPretSurAmendes').checked,
                penalite_retard_fixe: document.getElementById('penaliteRetard').value || null,
                date_limite_jour: document.getElementById('dateLimiteJour').value || null,
                heure_limite: document.getElementById('heureLimite').value || null,
                frais_caisse: document.getElementById('fraisCaisse').value || null,
                updated_at: Date.now()
            };

            if (!data.libelle) return alert("Veuillez saisir un nom pour la caisse.");

            try {
                const { data: caisse, error } = await db.from('caisses').insert(data).select('id').single();
                if (error) throw error;
                const { error: cycleError } = await db.from('cycles').insert({
                    caisse_id: caisse.id, numero_cycle: 1, date_debut: Date.now()
                });
                if (cycleError) throw cycleError;
                const { data: members, error: membersError } = await db.from('members')
                    .select('id').eq('tontine_id', tontineId).order('joined_at');
                if (membersError) throw membersError;
                if (members.length) {
                    const { error: participantsError } = await db.from('caisse_participants').insert(
                        members.map((member, index) => ({
                            caisse_id: caisse.id, member_id: member.id, ordre_passage: index + 1
                        }))
                    );
                    if (participantsError) throw participantsError;
                }
                window.location.href = `/tontine-details?id=${tontineId}`;
            } catch (e) {
                console.error(e);
                alert("Erreur : " + (e.message || "Enregistrement impossible"));
            }
        }
    </script>
</body>
</html>
